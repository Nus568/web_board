<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👨‍💼 Admin Dashboard - Login/Logout Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 1rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .activities-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        .activities-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .activities-title {
            font-size: 1.8rem;
            color: #333;
            font-weight: 600;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            background: #5a6fd8;
            transform: scale(1.05);
        }

        .activity-item {
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 12px;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 4px solid;
            transition: all 0.3s ease;
        }

        .activity-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .activity-item.login {
            border-left-color: #28a745;
        }

        .activity-item.logout {
            border-left-color: #dc3545;
        }

        .activity-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 18px;
            color: white;
            font-weight: bold;
        }

        .activity-icon.login {
            background: #28a745;
        }

        .activity-icon.logout {
            background: #dc3545;
        }

        .activity-content {
            flex: 1;
        }

        .activity-action {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 5px;
            color: #333;
        }

        .activity-details {
            color: #666;
            font-size: 14px;
            margin-bottom: 3px;
        }

        .activity-time {
            color: #999;
            font-size: 12px;
        }

        .no-data {
            text-align: center;
            color: #999;
            font-style: italic;
            padding: 40px;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .stats-container {
                grid-template-columns: 1fr;
            }
            
            .activities-header {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <button class="back-btn" onclick="goBack()">⬅️ กลับ</button>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>👨‍💼 Admin Dashboard</h1>
            <p>ระบบติดตาม Login/Logout เท่านั้น</p>
        </div>

        <!-- Stats Cards -->
        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-number" id="totalUsers">0</div>
                <div class="stat-label">👥 Total Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalActivities">0</div>
                <div class="stat-label">📊 Total Activities</div>
            </div>
        </div>

        <!-- Activities List -->
        <div class="activities-container">
            <div class="activities-header">
                <h2 class="activities-title">🔄 Recent Login/Logout Activities</h2>
                <button class="refresh-btn" onclick="loadDashboard()">🔄 Refresh</button>
            </div>
            <div id="activitiesList">
                <div class="no-data">กำลังโหลดข้อมูล...</div>
            </div>
        </div>
    </div>

    <script>
        // ✅ โหลด Dashboard
        function loadDashboard() {
            fetch('/admin/dashboard-data')
                .then(res => res.json())
                .then(data => {
                    // อัปเดตสถิติ
                    document.getElementById('totalUsers').textContent = data.totalUsers || 0;
                    document.getElementById('totalActivities').textContent = data.totalActivities || 0;
                    
                    // แสดงกิจกรรม
                    displayActivities(data.recentActivities || []);
                })
                .catch(err => {
                    console.error('❌ Error loading dashboard:', err);
                    document.getElementById('activitiesList').innerHTML = 
                        '<div class="no-data">❌ เกิดข้อผิดพลาดในการโหลดข้อมูล</div>';
                });
        }

        // ✅ แสดงกิจกรรม
        function displayActivities(activities) {
            const container = document.getElementById('activitiesList');
            
            if (activities.length === 0) {
                container.innerHTML = '<div class="no-data">ไม่มีข้อมูลกิจกรรม Login/Logout</div>';
                return;
            }

            const html = activities.map(activity => {
                const actionClass = activity.action === 'login' ? 'login' : 'logout';
                const icon = activity.action === 'login' ? '🔓' : '🔒';
                const actionText = activity.action === 'login' ? 'เข้าสู่ระบบ' : 'ออกจากระบบ';
                
                return `
                    <div class="activity-item ${actionClass}">
                        <div class="activity-icon ${actionClass}">${icon}</div>
                        <div class="activity-content">
                            <div class="activity-action">${actionText}</div>
                            <div class="activity-details">User ID: ${activity.user_id}</div>
                            <div class="activity-details">${activity.details || 'ไม่มีรายละเอียด'}</div>
                            <div class="activity-time">${formatDateTime(activity.created_at)}</div>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = html;
        }

        // ✅ จัดรูปแบบวันที่เวลา
        function formatDateTime(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString('th-TH', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        // ✅ กลับไปหน้าโพสต์
        function goBack() {
            window.location.href = '/posts.html';
        }

        // ✅ โหลดข้อมูลตอนเริ่มต้น
        document.addEventListener('DOMContentLoaded', function() {
            loadDashboard();
            
            // รีเฟรชอัตโนมัติทุก 30 วินาที
            setInterval(loadDashboard, 30000);
        });
    </script>
</body>
</html>
