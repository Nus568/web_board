<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>register</title>
  <link rel="stylesheet" href="style.css">
</head>
<div class="login-container">
<h2>สมัครสมาชิก</h2>
<form id="registerForm">
  <input type="text" id="username" name="username" placeholder="Username" autocomplete="username" required><br>
  <input type="email" id="email" name="email" placeholder="Email" autocomplete="email" required><br>
  <input type="password" id="password" name="password" placeholder="Password" autocomplete="new-password" required><br>


  <label for="roleRequest">เลือกบทบาท:</label>
    <select id="roleRequest" name="roleRequest" autocomplete="off">

    <option value="user">ผู้ใช้งานทั่วไป</option>
    <option value="admin">ขอเป็นผู้ดูแลระบบ</option>
  </select><br>
  <button type="submit">สมัครสมาชิก</button>
  <button onclick="goBackToLogin()" class="back-button">🔙 ย้อนกลับไปหน้าเข้าสู่ระบบ</button>

</form>
<div>
<div id="result"></div>

<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const username    = document.getElementById('username').value;
  const email       = document.getElementById('email').value;
  const password    = document.getElementById('password').value;
  const roleRequest = document.getElementById('roleRequest').value;

  const res = await fetch('http://localhost:3000/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, email, password, roleRequest })
  });

  const data = await res.json();
  document.getElementById('result').textContent = data.message || data.error;
  if (res.ok) window.location.href = 'login.html';
});
function goBackToLogin() {
  window.location.href = 'login.html';
}

</script>
