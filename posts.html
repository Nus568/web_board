<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Posts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h3>Create New Post</h3>
<form id="postForm">
  <input type="text" id="postTitle" placeholder="Title" required><br>
  <textarea id="postContent" placeholder="Content" required></textarea><br>
  <button type="submit">➕ Add Post</button>
  


</form>
<hr>
  <h2>Welcome, <span id="userDisplay"></span></h2>
  <button onclick="logout()">Logout</button>

  <div id="postsContainer"></div>



  <!-- ปุ่มเปิด popup -->
<button id="adminToggleBtn" style="position: fixed; top: 10px; right: 10px; z-index: 1000;">
  🛡️ คำขอผู้ดูแลระบบ
</button>

<!-- กล่อง popup -->
<div id="adminPopup" style="
  display: none;
  position: fixed;
  top: 50px;
  right: 10px;
  width: 300px;
  max-height: 400px;
  overflow-y: auto;
  background: white;
  border: 1px solid #ccc;
  padding: 10px;
  box-shadow: 0 0 10px rgba(0,0,0,0.2);
  z-index: 999;
">
  
  <div id="adminRequests"></div>
  <hr>
  <h3></h3>
  <div id="adminReports"></div>
</div>

  <script src="posts.js"></script>
</body>
</html>
