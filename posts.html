<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h3>Create New Post</h3>
<form id="postForm">
  <input type="text" id="postTitle" placeholder="Title" required><br>
  <textarea id="postContent" placeholder="Content" required></textarea><br>
  <button type="submit">➕ Add Post</button>
  


</form>
<hr>
  <h2>Welcome, <span id="userDisplay"></span></h2>
  <button onclick="logout()">Logout</button>

  <div id="postsContainer"></div>



  <!-- ปุ่มเปิด popup -->
<button id="adminToggleBtn" class="admin-toggle-btn">
  🛡️ คำขอผู้ดูแลระบบ
</button>

<!-- กล่อง popup -->
<div id="adminPopup" class="admin-popup">

  <div id="adminRequests"></div>
  <hr>
  
  <div id="adminReports"></div>
</div>

  <script src="posts.js"></script>
</body>
</html>
